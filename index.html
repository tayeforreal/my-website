<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday!</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle, #ffb6c1, #ff69b4);
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-family: 'Comic Sans MS', cursive, sans-serif;
    }

    h1 {
      font-size: 4rem;
      color: white;
      text-shadow: 2px 2px 4px #000;
      animation: pop 1s ease-out;
      display: none;
    }

    @keyframes pop {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      background-color: gold;
      animation: fall 3s linear infinite;
      display: none;
    }

    @keyframes fall {
      0% { transform: translateY(-100px) rotate(0deg); }
      100% { transform: translateY(100vh) rotate(360deg); }
    }

    .gift-box {
      width: 150px;
      height: 150px;
      background-color: #fff;
      border: 4px solid #ff1493;
      border-radius: 10px;
      position: relative;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      color: #ff1493;
      font-weight: bold;
    }

    .lid {
      position: absolute;
      width: 100%;
      height: 40px;
      background-color: #ff1493;
      top: -40px;
      left: 0;
      border-radius: 10px 10px 0 0;
      transition: transform 0.5s ease;
    }

    .open .lid {
      transform: translateY(-80px) rotate(-20deg);
    }
  </style>
</head>
<body>
  <div class="gift-box" id="giftBox">
    <div class="lid"></div>
    OPEN
  </div>

  <h1 id="birthdayMessage">Happy Birthday, Seun!</h1>

  <audio autoplay loop>
    <source src="https://openverse-api.openai.com/v1/audio/generate/7bffd4e1-e0a9-4bd7-89ec-105fbf54108d/jvke-her.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <script>
    const box = document.getElementById('giftBox');
    const message = document.getElementById('birthdayMessage');

    function createConfetti(count) {
      for (let i = 0; i < count; i++) {
        const confetti = document.createElement('div');
        confetti.classList.add('confetti');
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
        confetti.style.animationDuration = (Math.random() * 2 + 3) + 's';
        confetti.style.display = 'block';
        document.body.appendChild(confetti);
      }
    }

    box.addEventListener('click', () => {
      box.classList.add('open');
      message.style.display = 'block';
      message.style.animation = 'pop 1s ease-out';
      createConfetti(100);

      // Redirect to main birthday site after 4 seconds
      setTimeout(() => {
        window.location.href = "home.html"; // Change to your main page filename
      }, 4000);
    });
  </script>
</body>
</html>
